name: Run Dimension Analysis
on:
  push:
    branches:
      - main
      - new-batch-statements

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Cache pip dependencies
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Cache Hugging Face models - this is the key addition
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/transformers
            ~/.cache/huggingface/hub
          key: ${{ runner.os }}-hf-models-${{ hashFiles('.scripts/dimension_maker.py') }}-v1
          restore-keys: |
            ${{ runner.os }}-hf-models-

      # - name: Cache Large Hugging Face models
      #   uses: actions/cache@v4
      #   with:
      #     path: |
      #       ~/.cache/huggingface/transformers
      #       ~/.cache/huggingface/hub
      #     key: ${{ runner.os }}-hf-large-models-${{ hashFiles('.scripts/dimension_maker.py') }}-v1
      #     restore-keys: |
      #       ${{ runner.os }}-hf-large-models-
      #     # GitHub Actions cache limit is 10GB per repository
      #     # If models exceed this, consider using external storage

      - name: Set HUGGINGFACE_TOKEN and login to Hugging Face
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          pip install huggingface_hub
          echo "Login with huggingface_hub using a token"

      - name: Run the script
        run: python ./.scripts/dimension_maker.py
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Apply dimension analysis
